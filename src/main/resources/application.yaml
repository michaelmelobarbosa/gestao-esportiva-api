spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: gestao-esportiva-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

api:
  security:
    token:
      secret: ${API_SECURITY_TOKEN_SECRET}
      issuer: gestao-esportiva-api
      expiration: 2h

  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
