# =============================================================================
# Perfil de produção.
#
# Variáveis obrigatórias (o boot falha se faltarem):
#   API_SECURITY_TOKEN_SECRET  segredo do JWT (min. 32 caracteres)
#   API_CORS_ALLOWED_ORIGINS   origens do front-end, separadas por vírgula
#   DB_URL / DB_USER / DB_PASSWORD  conexão MySQL
#
# O schema é responsabilidade do Flyway; Hibernate apenas valida (ddl-auto: validate).
# =============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  docker:
    compose:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

api:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS}

  security:
    login-rate-limit:
      # O IP vem de request.getRemoteAddr(). Se a API ficar atrás de proxy/LB,
      # habilite server.forward-headers-strategy=framework e garanta que o proxy
      # é o único caminho de entrada (senão X-Forwarded-For é spoofável).
      max-por-ip: ${API_LOGIN_RATE_LIMIT_MAX_POR_IP:100}
      max-por-ip-email: ${API_LOGIN_RATE_LIMIT_MAX_POR_IP_EMAIL:5}
      janela: ${API_LOGIN_RATE_LIMIT_JANELA:15m}
      maximo-chaves: ${API_LOGIN_RATE_LIMIT_MAXIMO_CHAVES:100000}

logging:
  level:
    root: INFO
    br.gov.quixada.esporte: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
