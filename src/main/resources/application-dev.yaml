spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sports_management?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Recife
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: true
