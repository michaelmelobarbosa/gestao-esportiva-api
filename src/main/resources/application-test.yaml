spring:
  datasource:
    url: jdbc:h2:mem:sports_management_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  docker:
    compose:
      enabled: false

api:
  security:
    token:
      secret: segredo-de-teste-nao-usar-em-producao
      issuer: sports-management-api
      expiration: 2h

    login-rate-limit:
      max-per-ip: 100
      max-per-ip-email: 5
      window: 15m
      max-keys: 1000
